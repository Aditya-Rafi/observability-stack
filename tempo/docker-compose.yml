services:
  tempo:
    image: ${TEMPO_IMAGE:-grafana/tempo:main-3e07f9f-1848-1}
    container_name: tempo
    command:
      - '-config.file=/etc/tempo/tempo.yml'
    ports:
      - "${TEMPO_HTTP_PORT:-3200}:3200"        # query API
      - "${TEMPO_OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${TEMPO_OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo
    restart: unless-stopped
    networks:
      - observability

volumes:
  tempo-data:

networks:
  observability:
    name: observability
