apiVersion: 1
datasources:
  # --- Metrics ---
  - name: Mimir
    type: prometheus
    uid: mimir
    access: proxy
    url: http://mimir:9009/prometheus
    isDefault: true
    jsonData:
      httpMethod: POST

  # --- Logs ---
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Klik traceID di log -> loncat ke trace di Tempo.
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '(?:traceID|trace_id)=(\w+)'
          url: '${__value.raw}'

  # --- Tracing ---
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Dari sebuah trace -> cari log terkait di Loki.
      tracesToLogsV2:
        datasourceUid: loki
      lokiSearch:
        datasourceUid: loki
