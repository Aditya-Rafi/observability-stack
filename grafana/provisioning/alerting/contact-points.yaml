apiVersion: 1

contactPoints:
  - orgId: 1
    name: all-channels
    receivers:
      - uid: telegram_main
        type: telegram
        settings:
          bottoken: $__env{TELEGRAM_BOT_TOKEN}
          chatid: $__env{TELEGRAM_CHAT_ID}
          parse_mode: HTML
          disable_web_page_preview: true
          message: '{{ template "telegram.message" . }}'
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: all-channels
    group_by: ['alertname']
    group_wait: 30s
    group_interval: 2m
    repeat_interval: 1h

deleteContactPoints:
  - orgId: 1
    uid: whatsapp_callmebot
