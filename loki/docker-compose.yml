services:
  loki:
    image: ${LOKI_IMAGE:-grafana/loki:main-89ea0d4}
    container_name: loki
    command:
      - '-config.file=/etc/loki/loki.yml'
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    restart: unless-stopped
    networks:
      - observability

volumes:
  loki-data:

networks:
  observability:
    name: observability
